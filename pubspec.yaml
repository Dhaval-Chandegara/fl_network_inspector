name: fl_network_inspector
description: "A lightweight, modular in-app HTTP network inspector for Flutter applications with shake-to-open and SQLite persistence"
version: 1.0.1
homepage: https://github.com/Dhaval-Chandegara/fl_network_inspector
repository: https://github.com/Dhaval-Chandegara/fl_network_inspector
issue_tracker: https://github.com/Dhaval-Chandegara/fl_network_inspector/issues
topics:
  - network
  - http
  - inspector
  - logging
  - debugging
screenshots:
  - description: 'Network request listing with search, filtering, and status badges'
    path: screenshots/1.jpeg
  - description: 'Multi-parameter request filter modal sheet'
    path: screenshots/2.jpeg
  - description: 'Request details overview with timing and payload metrics'
    path: screenshots/3.jpeg
  - description: 'Request headers and redacted JSON body inspection'
    path: screenshots/4.jpeg
  - description: 'Response headers and formatted JSON body inspection'
    path: screenshots/5.jpeg
  - description: 'Detailed network error and exception callout diagnostics'
    path: screenshots/6.jpeg
  - description: 'Native share sheet export as Markdown, cURL, or JSON'
    path: screenshots/7.jpeg

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.6.0
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  path: ^1.9.1
  dio: ">=5.2.0 <6.0.0"
  http: ">=1.0.0 <2.0.0"
  intl: ^0.20.3
  share_plus: ^13.3.1
  sensors_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.25.0
  http_parser: ^4.0.2
